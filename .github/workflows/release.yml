name: Make release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to release (for example v2.7.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mpvrx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}

    steps:
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_tag="${GITHUB_REF#refs/tags/}"
          else
            version_tag="$INPUT_TAG"
          fi

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid stable release tag: $version_tag"
            exit 1
          fi
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.distribution.name }} release APKs
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - id: standard
            name: Standard
            gradle: Standard
            dir: standard
            abis: universal arm64-v8a armeabi-v7a x86 x86_64
            asset: ''
          - id: fongmi
            name: FongMi
            gradle: Fongmi
            dir: fongmi
            abis: universal
            asset: fongmi
          - id: no_vulkan
            name: No Vulkan
            gradle: NoVulkan
            dir: noVulkan
            abis: universal
            asset: no-vulkan
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      GRADLE_FLAVOR: ${{ matrix.distribution.gradle }}
      APK_DIR: ${{ matrix.distribution.dir }}
      APK_ABIS: ${{ matrix.distribution.abis }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.distribution.name }} Release APKs
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew "assemble${GRADLE_FLAVOR}Release" --stacktrace --no-daemon --max-workers=2

      - name: Sign and stage release APKs
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$apksigner"

          alias_name="$SIGNING_KEY_ALIAS"
          store_pass="$SIGNING_STORE_PASSWORD"
          key_pass="$KEY_PASSWORD"

          if [[ -z "$SIGNING_KEYSTORE" || -z "$alias_name" || -z "$store_pass" || -z "$key_pass" ]]; then
            echo "Signing secrets missing; generating fallback release keystore on the fly..."
            keytool -genkeypair -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
            alias_name="androiddebugkey"
            store_pass="android"
            key_pass="android"
          else
            printf '%s' "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          fi

          trap 'rm -f release.keystore' EXIT

          sign_apk() {
            local dir="$1"
            local base="$2"
            local label="$3"
            local signed="$dir/$base.apk"
            local unsigned="$dir/$base-unsigned.apk"
            local source=""

            if [[ -f "$unsigned" ]]; then
              source="$unsigned"
            elif [[ -f "$signed" ]]; then
              source="$signed"
            else
              echo "Missing expected $label APK: $unsigned (or $signed)"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi

            local staged="$dir/$base-signing.apk"
            rm -f "$staged"
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$alias_name" \
              --ks-pass "pass:$store_pass" \
              --key-pass "pass:$key_pass" \
              --out "$staged" \
              "$source"
            "$apksigner" verify --verbose "$staged"
            rm -f "$unsigned"
            mv -f "$staged" "$signed"
          }

          out_dir="app/build/outputs/apk/${APK_DIR}/release"
          test -d "$out_dir"
          mkdir -p release-assets

          for abi in $APK_ABIS; do
            base="app-${APK_DIR}-${abi}-release"
            sign_apk "$out_dir" "$base" "${APK_DIR} ${abi} release"
            cp "$out_dir/$base.apk" "release-assets/mpvRx-${ASSET_NAME:-$abi}-${VERSION_TAG}.apk"
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.distribution.id }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Verify assets and compute checksums
        shell: bash
        run: |
          set -euo pipefail
          : > checksums.txt
          variants=(universal arm64-v8a armeabi-v7a x86 x86_64 fongmi no-vulkan)
          for variant in "${variants[@]}"; do
            asset="release-assets/mpvRx-${variant}-${VERSION_TAG}.apk"
            if [[ ! -f "$asset" ]]; then
              echo "Missing expected release asset: $asset"
              find release-assets -type f -name '*.apk' -print || true
              exit 1
            fi
            sha256sum "$asset" | tee -a checksums.txt
          done

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8').splitlines()
          body = []
          in_changelog = False

          for line in changelog:
              if line.startswith('## ['):
                  if in_changelog:
                      break
                  in_changelog = True
                  continue
              if in_changelog:
                  body.append(line)

          notes = '\n'.join(body).strip()
          if not notes:
              notes = 'Stable release.'

          Path('release_notes.md').write_text(notes + '\n', encoding='utf-8')
          PY

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: mpvRx ${{ env.VERSION_TAG }}
          body_path: release_notes.md
          files: |
            release-assets/*.apk
            checksums.txt
          draft: false
          prerelease: false
